function b64decode(b){
  var bin = atob(b);
  var bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
var loaded = { quick:false, lab:false };
function show(name){
  document.querySelectorAll('.tab').forEach(function(t){
    t.classList.toggle('active', t.getAttribute('data-page') === name);
  });
  document.querySelectorAll('.frame').forEach(function(f){
    f.classList.toggle('active', f.id === 'f-' + name);
  });
  if (!loaded[name]) {
    var f = document.getElementById('f-' + name);
    f.srcdoc = b64decode(PAGES[name]);
    loaded[name] = true;
  }
}
document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click', function(){ show(t.getAttribute('data-page')); });
});
show('lab');
